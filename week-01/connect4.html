<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four</title>
<style>
  :root {
    --cell: min(calc((100vw - 40px) / 7.4), 76px);
    --pad: calc(var(--cell) * 0.18);
    --hr: calc(var(--cell) * 0.39);

    --bg: #f3f1ec;
    --card: #ffffff;
    --ink: #1d2130;
    --muted: #6b7080;
    --line: #e4e1da;
    --accent: #2f5bd3;

    --board: #2f5bd3;
    --board-edge: #2449b0;
    --hole: #e3e8f4;

    --p1: #e8473e;
    --p1-dark: #b62c24;
    --p2: #f5c230;
    --p2-dark: #c8930f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13151c;
      --card: #1c1f29;
      --ink: #eef0f5;
      --muted: #9aa0b2;
      --line: #2a2e3a;
      --accent: #6d8ff0;
      --board: #3160dc;
      --board-edge: #234cbc;
      --hole: #0c0e14;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 32px;
  }
  .app {
    width: calc(var(--cell) * 7 + var(--pad) * 2);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; font-weight: 750; }

  .controls { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: -6px; }
  .controls .hidden { visibility: hidden; }

  .segmented {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .segmented button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .segmented button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .score {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .score .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .score .value { font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.p1 { background: var(--p1); }
  .dot.p2 { background: var(--p2); }

  .status {
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 650;
    font-size: 18px;
  }
  .status .dot { width: 16px; height: 16px; }
  .thinking::after {
    content: "";
    display: inline-block;
    width: 1.2em;
    text-align: left;
    animation: dots 1s steps(4) infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  /* ---- Board ---- */
  .stage { position: relative; padding-top: var(--cell); user-select: none; -webkit-user-select: none; }
  .preview { position: absolute; top: 0; left: 0; right: 0; height: var(--cell); pointer-events: none; }
  .preview .disc {
    position: absolute;
    top: calc(var(--cell) * 0.1);
    left: calc(var(--pad) + var(--col) * var(--cell) + var(--cell) * 0.1);
    transition: left .14s ease-out, opacity .2s;
  }
  .preview.hidden .disc { opacity: 0; }

  .board { position: relative; }
  .discs {
    position: absolute;
    inset: 0;
    padding: var(--pad);
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows: repeat(6, var(--cell));
    background: var(--hole);
    border-radius: calc(var(--cell) * 0.3);
    z-index: 1;
  }
  .frame {
    position: relative;
    z-index: 2;
    /* A border (not padding + background) so the holes stay see-through to the discs behind. */
    border: var(--pad) solid var(--board);
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows: repeat(6, var(--cell));
    border-radius: calc(var(--cell) * 0.3);
    box-shadow: 0 calc(var(--cell) * 0.12) 0 var(--board-edge), 0 18px 40px rgba(20, 30, 70, .25);
  }
  .hole {
    background: radial-gradient(circle,
      transparent 0 var(--hr),
      var(--board-edge) var(--hr) calc(var(--hr) + 3px),
      var(--board) calc(var(--hr) + 4px));
  }

  .disc {
    width: calc(var(--cell) * 0.8);
    height: calc(var(--cell) * 0.8);
    border-radius: 50%;
    place-self: center;
    box-shadow:
      inset 0 0 0 calc(var(--cell) * 0.07) rgba(0, 0, 0, .12),
      inset 0 calc(var(--cell) * -0.05) 0 rgba(0, 0, 0, .12);
  }
  .disc.p1 { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.4), transparent 45%), var(--p1); }
  .disc.p2 { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), transparent 45%), var(--p2); }
  .disc.drop { animation: drop .4s both; }
  @keyframes drop {
    0%   { transform: translateY(calc(-1 * ((var(--row) + 1) * var(--cell) + var(--pad)))); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    72%  { transform: translateY(0); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
    86%  { transform: translateY(calc(var(--cell) * -0.1)); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    100% { transform: translateY(0); }
  }
  .board.over .discs .disc:not(.win) { opacity: .35; transition: opacity .4s; }
  .disc.win { animation: drop .4s both, pulse 1s ease-in-out .3s infinite alternate; }
  @keyframes pulse {
    from { box-shadow: inset 0 0 0 calc(var(--cell) * 0.07) rgba(0,0,0,.12), 0 0 0 0 rgba(255,255,255,0); }
    to   { box-shadow: inset 0 0 0 calc(var(--cell) * 0.07) rgba(255,255,255,.85), 0 0 0 calc(var(--cell) * 0.05) rgba(255,255,255,.35); }
  }

  .hits {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--pad);
    right: var(--pad);
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    z-index: 5;
  }
  .hits button {
    border: 0;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    border-radius: calc(var(--cell) * 0.2);
    -webkit-tap-highlight-color: transparent;
  }
  .hits button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .stage.locked .hits button, .hits button.full { cursor: default; }

  .actions { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }
  .btn {
    font: inherit;
    font-weight: 650;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .1s, background .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.attention { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .disc.drop, .disc.win { animation-duration: .01s !important; }
    .btn.attention { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Connect Four</h1>
  </header>

  <div class="controls">
    <div class="segmented" role="group" aria-label="Mode" id="modes">
      <button data-mode="cpu">vs Computer</button>
      <button data-mode="pvp">2 Players</button>
    </div>
    <div class="segmented" role="group" aria-label="Difficulty" id="levels">
      <button data-level="easy">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
    </div>
  </div>

  <section class="scores" aria-label="Score">
    <div class="score"><span class="label"><span class="dot p1"></span><span id="l-p1">You</span></span><span class="value" id="s-p1">0</span></div>
    <div class="score"><span class="label">Draws</span><span class="value" id="s-draw">0</span></div>
    <div class="score"><span class="label"><span class="dot p2"></span><span id="l-p2">Computer</span></span><span class="value" id="s-p2">0</span></div>
  </section>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="stage" id="stage">
    <div class="preview" id="preview"><div class="disc p1"></div></div>
    <div class="board" id="board">
      <div class="discs" id="discs"></div>
      <div class="frame" id="frame"></div>
    </div>
    <div class="hits" id="hits"></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="new">New game</button>
    <button class="btn" id="reset">Reset score</button>
  </div>
  <p class="hint">Click a column, or use ← → and Enter (keys 1–7 drop directly). Starting player alternates each game.</p>
</main>

<script>
// ---------- Game engine (no DOM) ----------
const ROWS = 6, COLS = 7, HUMAN = 1, AI = 2, WIN = 1e6;
const ORDER = [3, 2, 4, 1, 5, 0, 6]; // center-first ordering speeds up alpha-beta
const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const LEVELS = {
  easy:   { depth: 2, blunder: 0.3 },
  medium: { depth: 4, blunder: 0.08 },
  hard:   { depth: 6, blunder: 0 },
};

// Every possible line of four cells, precomputed for the evaluation function.
const WINDOWS = [];
for (let r = 0; r < ROWS; r++)
  for (let c = 0; c < COLS; c++)
    for (const [dr, dc] of DIRS) {
      const er = r + 3 * dr, ec = c + 3 * dc;
      if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
      WINDOWS.push([0, 1, 2, 3].map(i => [r + i * dr, c + i * dc]));
    }

const newBoard = () => Array.from({ length: ROWS }, () => Array(COLS).fill(0));
const validCols = b => ORDER.filter(c => b[0][c] === 0);

function openRow(b, c) {
  for (let r = ROWS - 1; r >= 0; r--) if (b[r][c] === 0) return r;
  return -1;
}

// Returns the winning cells if the disc at (r, c) completes four in a row.
function winFrom(b, r, c, p) {
  for (const [dr, dc] of DIRS) {
    const cells = [[r, c]];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr][cc] === p) {
        cells.push([rr, cc]);
        rr += dr * s; cc += dc * s;
      }
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}

// Heuristic score from the computer's point of view.
function evaluate(b) {
  let s = 0;
  for (let r = 0; r < ROWS; r++) {
    if (b[r][3] === AI) s += 3; else if (b[r][3] === HUMAN) s -= 3;
  }
  for (const w of WINDOWS) {
    let ai = 0, hu = 0;
    for (const [r, c] of w) {
      if (b[r][c] === AI) ai++; else if (b[r][c] === HUMAN) hu++;
    }
    if (ai && hu) continue;
    if (ai === 3) s += 5; else if (ai === 2) s += 2;
    else if (hu === 3) s -= 6; else if (hu === 2) s -= 2;
  }
  return s;
}

function minimax(b, depth, alpha, beta, maximizing) {
  const cols = validCols(b);
  if (!cols.length) return 0;
  if (depth === 0) return evaluate(b);
  const p = maximizing ? AI : HUMAN;
  let best = maximizing ? -Infinity : Infinity;
  for (const c of cols) {
    const r = openRow(b, c);
    b[r][c] = p;
    const v = winFrom(b, r, c, p)
      ? (maximizing ? WIN + depth : -WIN - depth) // prefer faster wins, slower losses
      : minimax(b, depth - 1, alpha, beta, !maximizing);
    b[r][c] = 0;
    if (maximizing) { best = Math.max(best, v); alpha = Math.max(alpha, v); }
    else { best = Math.min(best, v); beta = Math.min(beta, v); }
    if (alpha >= beta) break;
  }
  return best;
}

function chooseMove(board, level) {
  const cfg = LEVELS[level];
  const b = board.map(row => row.slice());
  const cols = validCols(b);
  const winsFor = (c, p) => {
    const r = openRow(b, c);
    b[r][c] = p;
    const w = winFrom(b, r, c, p);
    b[r][c] = 0;
    return !!w;
  };

  const win = cols.find(c => winsFor(c, AI));
  if (win !== undefined) return win;
  const block = cols.find(c => winsFor(c, HUMAN));
  if (block !== undefined && Math.random() >= cfg.blunder) return block;
  if (Math.random() < cfg.blunder) return cols[Math.floor(Math.random() * cols.length)];

  let best = -Infinity, bestCols = [];
  for (const c of cols) {
    const r = openRow(b, c);
    b[r][c] = AI;
    const v = minimax(b, cfg.depth - 1, -Infinity, Infinity, false);
    b[r][c] = 0;
    if (v > best) { best = v; bestCols = [c]; }
    else if (v === best) bestCols.push(c);
  }
  return bestCols[Math.floor(Math.random() * bestCols.length)];
}
</script>

<script>
// ---------- UI ----------
const $ = id => document.getElementById(id);
const stageEl = $("stage"), boardEl = $("board"), discsEl = $("discs"), frameEl = $("frame");
const hitsEl = $("hits"), previewEl = $("preview"), statusEl = $("status"), newBtn = $("new");

// In "cpu" mode player 1 is HUMAN and player 2 is AI; in "pvp" mode both are people.
const NAMES = { cpu: { 1: "You", 2: "Computer" }, pvp: { 1: "Red", 2: "Yellow" } };
const emptyScore = () => ({ p1: 0, draw: 0, p2: 0 });

let board, turn, over, busy, discEls, gameId = 0;
let starter = 1, hoverCol = 3, level = "medium", mode = "cpu";
let scores = { cpu: emptyScore(), pvp: emptyScore() };

try {
  const saved = JSON.parse(localStorage.getItem("c4-scores"));
  if (saved) for (const m in scores) Object.assign(scores[m], saved[m]);
  level = localStorage.getItem("c4-level") || level;
  mode = localStorage.getItem("c4-mode") || mode;
} catch {}
if (!LEVELS[level]) level = "medium";
if (!NAMES[mode]) mode = "cpu";

const save = () => {
  try {
    localStorage.setItem("c4-scores", JSON.stringify(scores));
    localStorage.setItem("c4-level", level);
    localStorage.setItem("c4-mode", mode);
  } catch {}
};

const humanTurn = () => mode === "pvp" || turn === HUMAN;
const turnStatus = () => mode === "pvp"
  ? `<span class="dot p${turn}"></span>${NAMES.pvp[turn]}'s turn`
  : `<span class="dot p1"></span>Your move`;

for (let i = 0; i < ROWS * COLS; i++) {
  const h = document.createElement("div");
  h.className = "hole";
  frameEl.append(h);
}
for (let c = 0; c < COLS; c++) {
  const btn = document.createElement("button");
  btn.setAttribute("aria-label", `Drop disc in column ${c + 1}`);
  btn.addEventListener("pointerenter", () => setHover(c));
  btn.addEventListener("focus", () => setHover(c));
  btn.addEventListener("click", () => { setHover(c); humanPlay(c); });
  hitsEl.append(btn);
}

function setHover(c) {
  hoverCol = c;
  previewEl.style.setProperty("--col", c);
}

function render() {
  const humanCanPlay = !over && !busy && humanTurn();
  previewEl.classList.toggle("hidden", !humanCanPlay);
  previewEl.firstElementChild.className = `disc p${turn}`;
  stageEl.classList.toggle("locked", !humanCanPlay);
  [...hitsEl.children].forEach((btn, c) => btn.classList.toggle("full", board[0][c] !== 0));
  const score = scores[mode];
  $("s-p1").textContent = score.p1;
  $("s-draw").textContent = score.draw;
  $("s-p2").textContent = score.p2;
  $("l-p1").textContent = NAMES[mode][1];
  $("l-p2").textContent = NAMES[mode][2];
  $("levels").classList.toggle("hidden", mode !== "cpu");
  document.querySelectorAll("#levels button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.level === level));
  document.querySelectorAll("#modes button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === mode));
}

function setStatus(html, thinking = false) {
  statusEl.innerHTML = html;
  statusEl.classList.toggle("thinking", thinking);
}

function newGame() {
  gameId++;
  board = newBoard();
  discEls = newBoard();
  over = false;
  busy = false;
  turn = starter;
  discsEl.innerHTML = "";
  boardEl.classList.remove("over");
  newBtn.classList.remove("attention");
  setHover(hoverCol);
  if (mode === "cpu" && turn === AI) aiTurn();
  else setStatus(turnStatus());
  render();
}

function humanPlay(c) {
  if (over || busy || !humanTurn() || board[0][c] !== 0) return;
  drop(c, turn);
}

function drop(c, p) {
  const r = openRow(board, c);
  board[r][c] = p;

  const el = document.createElement("div");
  const dur = 0.3 + 0.05 * r;
  el.className = `disc p${p} drop`;
  el.style.gridRow = r + 1;
  el.style.gridColumn = c + 1;
  el.style.setProperty("--row", r);
  el.style.animationDuration = `${dur}s`;
  discsEl.append(el);
  discEls[r][c] = el;

  busy = true;
  render();
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId) return;
    busy = false;
    const cells = winFrom(board, r, c, p);
    if (cells) return endGame(p, cells);
    if (!validCols(board).length) return endGame(0);
    turn = p === 1 ? 2 : 1;
    if (mode === "cpu" && turn === AI) aiTurn();
    else setStatus(turnStatus());
    render();
  }, dur * 1000);
}

function aiTurn() {
  busy = true;
  setStatus(`<span class="dot p2"></span>Computer is thinking`, true);
  render();
  const id = gameId;
  // Let the status repaint before the (synchronous) search runs.
  setTimeout(() => {
    if (id !== gameId) return;
    drop(chooseMove(board, level), AI);
  }, 450);
}

function endGame(winner, cells = []) {
  over = true;
  boardEl.classList.add("over");
  for (const [r, c] of cells) discEls[r][c].classList.add("win");
  const score = scores[mode];
  if (!winner) { score.draw++; setStatus("It's a draw."); }
  else {
    score[`p${winner}`]++;
    const msg = mode === "pvp" ? `${NAMES.pvp[winner]} wins!`
      : winner === HUMAN ? "You win! Nicely played." : "Computer wins. Try again?";
    setStatus(`<span class="dot p${winner}"></span>${msg}`);
  }
  starter = starter === 1 ? 2 : 1;
  newBtn.classList.add("attention");
  save();
  render();
}

document.querySelectorAll("#levels button").forEach(b =>
  b.addEventListener("click", () => { level = b.dataset.level; save(); render(); }));
document.querySelectorAll("#modes button").forEach(b =>
  b.addEventListener("click", () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    starter = 1;
    save();
    newGame();
  }));
newBtn.addEventListener("click", newGame);
$("reset").addEventListener("click", () => {
  scores[mode] = emptyScore();
  save();
  render();
});

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest(".segmented, .actions")) return;
  if (e.key === "ArrowLeft") { setHover((hoverCol + COLS - 1) % COLS); e.preventDefault(); }
  else if (e.key === "ArrowRight") { setHover((hoverCol + 1) % COLS); e.preventDefault(); }
  else if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { humanPlay(hoverCol); e.preventDefault(); }
  else if (/^[1-7]$/.test(e.key)) { setHover(+e.key - 1); humanPlay(+e.key - 1); }
});

newGame();
</script>
</body>
</html>
