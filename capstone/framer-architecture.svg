<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 870" width="1420" height="870" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Problem Framer: how one session becomes a frozen problem frame and two durable outputs</title>
  <desc>A user's concern, idea, or proposed solution goes through Progressive Framing and Terminal Reconciliation at /end. The user chooses Confirm or Pause, which freezes the Frozen Semantic Basis (the frozen problem frame). Two durable outputs come from it: the Human Problem-Framing Report and the AI Portable State / Follow-on AI Prompt. The Independent Review reads a copy of the frozen basis and contributes only to the Human Problem-Framing Report. It cannot modify the frozen basis, change Confirm or Pause, flow back into framing, or enter the AI Portable State.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  </defs>
  <rect width="1420" height="870" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="50" font-size="30" font-weight="700" fill="#1E293B">Problem Framer: from a first concern to a confirmed problem frame</text>
  <text x="30" y="82" font-size="18" fill="#475569">The Framer frames. The user decides. The Independent Review stays on the human side.</text>

  <!-- FRAMING zone -->
  <rect x="30" y="110" width="420" height="560" rx="16" fill="#F1F5F9"/>
  <text x="50" y="140" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1.5">FRAMING · THE FRAMER</text>

  <rect x="50" y="156" width="380" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="70" y="192" font-size="20" font-weight="700" fill="#1E293B">User concern, idea, or</text>
  <text x="70" y="217" font-size="20" font-weight="700" fill="#1E293B">proposed solution</text>
  <text x="70" y="238" font-size="15" fill="#64748B">in the user's own words</text>

  <line x1="240" y1="248" x2="240" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="50" y="284" width="380" height="204" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="70" y="320" font-size="22" font-weight="700" fill="#1E293B">Progressive Framing</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M400,298 a12,12 0 1 1 -10,18" marker-end="url(#a)"/></g>
  <g font-size="16.5" fill="#334155">
    <text x="70" y="354">• Reflects back what the user said</text>
    <text x="70" y="381">• Asks one targeted question per turn</text>
    <text x="70" y="408">• Keeps a proposed solution apart</text>
    <text x="84" y="429">from the underlying problem</text>
    <text x="70" y="456">• Keeps uncertainty and qualifications</text>
    <text x="84" y="477">as the user stated them</text>
  </g>

  <line x1="240" y1="488" x2="240" y2="516" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="50" y="520" width="380" height="130" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="70" y="556" font-size="20" font-weight="700" fill="#1E293B">Terminal Reconciliation at /end</text>
  <g font-size="16.5" fill="#334155">
    <text x="70" y="586">The user types /end. The Framer</text>
    <text x="70" y="609">integrates the whole session, once,</text>
    <text x="70" y="632">into one draft problem frame.</text>
  </g>

  <!-- User gate -->
  <line x1="430" y1="585" x2="476" y2="585" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="480" y="510" width="190" height="150" rx="14" fill="#0F766E"/>
  <text x="575" y="540" font-size="12.5" font-weight="700" fill="#99F6E4" text-anchor="middle" letter-spacing="1.5">THE USER DECIDES</text>
  <text x="575" y="574" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">User Confirm</text>
  <text x="575" y="601" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">/ Pause</text>
  <text x="575" y="630" font-size="14" fill="#CCFBF1" text-anchor="middle">or keep framing;</text>
  <text x="575" y="648" font-size="14" fill="#CCFBF1" text-anchor="middle">the tool never decides</text>

  <line x1="670" y1="585" x2="716" y2="585" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="693" y="574" font-size="12" fill="#475569" text-anchor="middle">freezes</text>

  <!-- HUB: frozen semantic basis -->
  <rect x="720" y="400" width="300" height="310" rx="16" fill="#1E293B"/>
  <g transform="translate(980,428)" fill="none" stroke="#93C5FD" stroke-width="2.2">
    <rect x="-11" y="0" width="22" height="16" rx="3" fill="#93C5FD"/>
    <path d="M-6,0 v-6 a6,6 0 0 1 12,0 v6"/>
  </g>
  <text x="742" y="443" font-size="25" font-weight="700" fill="#FFFFFF">Frozen Semantic</text>
  <text x="742" y="472" font-size="25" font-weight="700" fill="#FFFFFF">Basis</text>
  <text x="742" y="497" font-size="16" fill="#CBD5E1">the frozen problem frame</text>
  <line x1="742" y1="514" x2="998" y2="514" stroke="#475569"/>
  <g font-size="16" fill="#E2E8F0">
    <text x="742" y="543"><tspan font-weight="700" fill="#FFFFFF">Part A</tspan> · what the user supplied,</text>
    <text x="742" y="564">with its standing</text>
    <text x="742" y="597"><tspan font-weight="700" fill="#FFFFFF">Part B</tspan> · the tool's integrated</text>
    <text x="742" y="618">understanding</text>
    <text x="742" y="651"><tspan font-weight="700" fill="#FFFFFF">Problem statement</tspan> + status</text>
    <text x="742" y="672">(Confirmed or Paused)</text>
  </g>
  <text x="742" y="697" font-size="13" fill="#93C5FD">Nothing after this point changes it</text>

  <!-- HUMAN-FACING zone (review content stays inside) -->
  <rect x="700" y="108" width="690" height="262" rx="16" fill="#FFFBF5" stroke="#D97706" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="720" y="134" font-size="13" font-weight="700" fill="#B45309" letter-spacing="1.5">HUMAN-FACING · REVIEW CONTENT STAYS INSIDE THIS LINE</text>

  <!-- Independent Review -->
  <rect x="720" y="150" width="300" height="200" rx="12" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="740" y="184" font-size="22" font-weight="700" fill="#7C2D12">Independent Review</text>
  <text x="740" y="207" font-size="15" fill="#9A3412">A separate assessment, made</text>
  <text x="740" y="226" font-size="15" fill="#9A3412">after Confirm or Pause</text>
  <g font-size="14" fill="#7C2D12">
    <text x="740" y="254" font-weight="700">It cannot:</text>
    <text x="740" y="274">✕ modify the frozen basis</text>
    <text x="740" y="293">✕ change Confirm or Pause</text>
    <text x="740" y="312">✕ flow back into framing</text>
    <text x="740" y="331">✕ enter the AI Portable State</text>
  </g>

  <!-- basis -> review (one way, read only) -->
  <line x1="870" y1="400" x2="870" y2="354" stroke="#B45309" stroke-width="2" marker-end="url(#aw)"/>
  <text x="880" y="386" font-size="13" fill="#B45309">reads a copy · one way</text>

  <!-- Human report -->
  <rect x="1075" y="150" width="295" height="200" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="1095" y="184" font-size="21" font-weight="700" fill="#1E293B">Human Problem-Framing</text>
  <text x="1095" y="209" font-size="21" font-weight="700" fill="#1E293B">Report</text>
  <text x="1095" y="236" font-size="12.5" font-weight="700" fill="#64748B" letter-spacing="0.6">DURABLE OUTPUT · FOR PEOPLE</text>
  <g font-size="15.5" fill="#334155">
    <text x="1095" y="264">The framing, with its status</text>
    <text x="1095" y="296" fill="#9A3412" font-weight="700">+ Independent Review</text>
    <text x="1095" y="316" fill="#9A3412">as its last section only</text>
  </g>

  <!-- review -> report -->
  <line x1="1020" y1="296" x2="1071" y2="296" stroke="#B45309" stroke-width="2" marker-end="url(#aw)"/>

  <!-- basis -> report (framing sections) -->
  <path d="M1020,450 H1150 V354" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="1162" y="440" font-size="13" fill="#475569">framing sections</text>

  <!-- AI portable state -->
  <rect x="1075" y="520" width="295" height="190" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="1095" y="554" font-size="21" font-weight="700" fill="#1E293B">AI Portable State /</text>
  <text x="1095" y="579" font-size="21" font-weight="700" fill="#1E293B">Follow-on AI Prompt</text>
  <text x="1095" y="606" font-size="12.5" font-weight="700" fill="#64748B" letter-spacing="0.6">DURABLE OUTPUT · FOR ANOTHER AI</text>
  <g font-size="15.5" fill="#334155">
    <text x="1095" y="634">Status, how to read it,</text>
    <text x="1095" y="655">Part A and Part B</text>
    <text x="1095" y="689" font-weight="700" fill="#B91C1C">⊘ No review content</text>
  </g>

  <!-- basis -> AI state -->
  <line x1="1020" y1="615" x2="1071" y2="615" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- blocked: review never reaches AI state -->
  <line x1="1300" y1="370" x2="1300" y2="510" stroke="#B91C1C" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1300" cy="440" r="15" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
  <path d="M1291,431 L1309,449 M1309,431 L1291,449" stroke="#B91C1C" stroke-width="2.5"/>
  <text x="1322" y="436" font-size="13" fill="#B91C1C">review</text>
  <text x="1322" y="453" font-size="13" fill="#B91C1C">blocked</text>

  <!-- Authority rule -->
  <rect x="30" y="745" width="1360" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="54" y="778" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1.5">AUTHORITY RULE</text>
  <g font-size="16" font-weight="700">
    <text x="54" y="816" fill="#1E293B">The Framer owns framing.</text>
    <text x="304" y="816" fill="#0F766E">The user owns Confirm or Pause.</text>
    <text x="607" y="816" fill="#B45309">The Independent Review owns only the Independent Review.</text>
    <text x="1118" y="816" fill="#1E293B">Nothing flows backward.</text>
  </g>
</svg>
